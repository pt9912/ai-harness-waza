id: m02-13-001
name: Audit-Stichprobe - Auswahl und Umfang
description: |
  Prueft Regel M02-13 (modul-02-harness-bootstrap.md v6.10.0, §Freshness-Audit der
  vendored Baseline, letzter Bullet "Eine Stichprobe gegen den Bestand, nicht gegen
  das Delta"): Die Stichprobe zieht aus den Baseline-Abschnitten, die seit dem
  adoptierten Tag KEIN Delta hatten (Komplementaermenge zu `git diff <alt> <neu> --
  .harness/baseline/`); Umfang ein Abschnitt pro Audit, rotierend, keine
  Vollinventur; Frage pro Regel: steht sie im ausgefuellten Artefakt oder als
  deklarierte Abweichung? Zweimal nein = nie uebernommen. Fixture: adoptiert v6.8.0,
  neu v6.10.0, git-diff-stat mit sechs geaenderten Dateien plus Gesamtliste.
  Ohne Regelwerk antwortet ein Modell typischerweise: stichprobenartig dort pruefen,
  wo sich etwas geaendert hat (Risiko-Fokus) oder zufaellig quer ueber alle Dateien,
  oder gleich alles pruefen. Das ist hier falsch: Die geaenderten Dateien decken
  schon die Delta-Review ab; die Stichprobe gilt den unsichtbaren alten, stabilen
  Regeln, und sie ist auf einen Abschnitt je Audit begrenzt.
    Bewertung: Der LLM-Judge entscheidet; die verbleibende Regex ist nur eine Plausibilitaetspruefung der Kernaussage.
tags:
- m02-13
- stufe-3
- modul-02
- fixture
inputs:
  prompt: 'Nach dem AI-Harness-Regelwerk: Beim Baseline-Audit (Angaben und Diff in der Datei) ist ein neuer Tag erschienen. Den Review der geaenderten Dateien machen wir ohnehin. Zusaetzlich wollen wir eine Stichprobe gegen die Baseline ziehen, um zu pruefen, ob wir alles Noetige wirklich uebernommen haben. Aus welchen Teilen der Baseline ziehen wir die Stichprobe, wie viel pruefen wir pro Audit, und welche Frage stellen wir pro Regel?'
  files:
  - path: m02-13-baseline-diff.md
expected:
  outcomes:
  - type: task_completed
graders:
- type: text
  name: stichprobe_komplement_ein_abschnitt
  config:
    regex_match:
    - '(?i)(kein(e|en)?\s+(delta|(ä|ae)nderung)|unver(ä|ae)ndert\w*|nicht\s+(ge(ä|ae)ndert\w*|betroffen)|komplement(ä|ae)r\w*)[^\n]{0,200}(abschnitt|datei)|(ein(en)?|1)\s+(einzelne[nr]?\s+)?abschnitt'
- type: prompt
  name: judge_m02_13_001
  config:
    model: minimax-m3:cloud
    continue_session: true
    prompt: |
      Du bewertest die letzte Antwort eines KI-Agenten auf eine Frage zum AI-Harness-Regelwerk.
      Referenz (laut Regelwerk): Die Stichprobe geht gegen den Bestand, nicht gegen das Delta. Auswahlkriterium: Abschnitte der Baseline, die seit dem adoptierten Tag kein Delta hatten, also die Komplementaermenge zum `git diff <alt> <neu> -- .harness/baseline/`; kein Delta-Review hat sie je beruehrt. Umfang: ein Abschnitt pro Audit, rotierend, keine Vollinventur (sonst verliert die Welle ihr Closure-Kriterium). Frage pro Regel: Steht sie im ausgefuellten Artefakt, oder als deklarierte Abweichung? Zweimal nein heisst: nie uebernommen. modul-02-harness-bootstrap.md §Freshness-Audit der vendored Baseline, letzter Bullet "Eine Stichprobe gegen den Bestand, nicht gegen das Delta", v6.10.0.
      Beispiel fuer eine RICHTIGE Antwort: Die geaenderten sechs Dateien deckt der Delta-Review ab. Die Stichprobe zieht ihr aus dem Rest, also aus Abschnitten ohne Aenderung seit v6.8.0, etwa modul-11-verification.md oder grundlagen-traceability.md; die Regeln dort hat nie ein Diff beruehrt, und genau da versteckt sich Nie-Uebernommenes. Pro Audit genau ein Abschnitt, rotierend, keine Vollinventur. Pro Regel fragt ihr: Steht sie im ausgefuellten Artefakt oder als deklarierte Abweichung (MR)? Zweimal nein heisst: nie uebernommen.
      Beispiel fuer eine FALSCHE Antwort: Die Stichprobe zieht ihr aus den geaenderten Dateien (modul-06, modul-09, modul-13), weil dort das Risiko am hoechsten ist. Wer will, prueft alle Regeln dieser Dateien durch. Pro Regel fragt ihr, ob die neue Fassung noch zu euren Artefakten passt.
      Kriterium: Die Antwort trifft dieselbe Kernentscheidung wie die Referenz: Die Stichprobe kommt aus den Abschnitten OHNE Delta (nicht aus den geaenderten Dateien), umfasst einen Abschnitt pro Audit (keine Vollinventur), und die Frage pro Regel lautet, ob sie im Artefakt steht oder als Abweichung deklariert ist. Formulierung, Synonyme, zusaetzliche korrekte Details und die Reihenfolge der Saetze sind unerheblich. Die Antwort besteht NICHT, wenn sie die Stichprobe auf die geaenderten Dateien legt, eine Vollinventur verlangt, der Referenz sonst widerspricht oder nur Randbegriffe nennt.
      Bei Erfuellung rufe set_waza_grade_pass auf, sonst set_waza_grade_fail mit einer Begruendung in einem Satz.
