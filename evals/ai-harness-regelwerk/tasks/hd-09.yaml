id: hd-09-001
name: Retiriertes Gate - Zeile und Sensor-Datei
description: |
  Prueft HD-09 (grundlagen-harness-dateien.md v6.10.0, §harness/README.md als
  Einstiegspunkt, Absaetze "Kein Verzeichnis-Lifecycle: ein retiriertes Gate ist
  weg" und "Deshalb wird die Datei direkt adressiert"): Es gibt kein
  `sensors/done/` und kein Archiv; die Zeile verschwindet aus der Sensors-Tabelle,
  die Datei harness/sensors/<target>.md wird geloescht (kein Status-/Datumsfeld,
  kein Deprecated-Vermerk; die Historie haelt git). Lebende Artefakte (AGENTS.md,
  Spec) mit Link auf die Datei werden nachgezogen (der rote Link-Sensor ist das
  gewollte Signal); einfrierende Artefakte (geschlossener Slice, Review-Report)
  nennen `make <target>` als Token und werden nicht angefasst. Fixtures: README
  mit verlinkter mutation-Zeile, grep-Ausgabe der Verweise.
  Ohne Regelwerk antwortet ein Modell typischerweise: Zeile als deprecated/retired
  markieren, Datei in ein Archiv-Verzeichnis (archive/ oder done/) verschieben, damit
  die Historie erhalten bleibt, und alle Verweise (auch im geschlossenen Slice) darauf
  umbiegen. Das ist hier falsch, weil das Regelwerk kein Gate-Archiv kennt, die
  Historie in git haelt und geschlossene Zeitdokumente nicht nachgezogen werden.
    Bewertung: Der LLM-Judge entscheidet; die verbleibende Regex ist nur eine Plausibilitaetspruefung der Kernaussage.
tags:
- hd-09
- stufe-2
- hd
- fixture
inputs:
  prompt: 'Nach dem AI-Harness-Regelwerk: Wir schaffen das Gate mutation ab; `make mutation` fliegt mit dem naechsten Merge aus dem Makefile. In hd-09-harness-readme.md steht die Sensors-Tabelle, in hd-09-verweise.txt die Fundstellen im Repo. Wir wuerden die Zeile als deprecated markieren und harness/sensors/mutation.md in ein Archiv-Verzeichnis verschieben, damit die Historie nicht verloren geht. Wie gehen wir mit der Tabellenzeile, der Sensor-Datei und den Verweisen aus den Fundstellen richtig um?'
  files:
  - path: hd-09-harness-readme.md
  - path: hd-09-verweise.txt
expected:
  outcomes:
  - type: task_completed
graders:
- type: text
  name: zeile_und_datei_weg
  config:
    regex_match:
    - '(?i)((zeile|datei|sensors/mutation)[^\n]{0,100}(l(ö|oe)sch\w*|entfern\w*|gestrichen|verschwind\w*|wird\s+weg)|(l(ö|oe)sch\w*|entfern\w*|streich\w*)[^\n]{0,60}(zeile|datei))'
- type: prompt
  name: judge_hd_09_001
  config:
    model: minimax-m3:cloud
    continue_session: true
    prompt: |
      Du bewertest die letzte Antwort eines KI-Agenten auf eine Frage zum AI-Harness-Regelwerk.
      Referenz (laut Regelwerk): Ein retiriertes Gate ist weg: Es gibt keinen Verzeichnis-Lifecycle und kein `sensors/done/`. Die Zeile verschwindet aus der Sensors-Tabelle, die Datei `harness/sensors/mutation.md` verschwindet aus dem Verzeichnis (sie wird nicht in ein done/-Verzeichnis verschoben); die Sensor-Datei traegt kein Status- und kein Datumsfeld (der Zustand eines Gates ist sein Lauf, das Aenderungsdatum haelt `git`); ein Gate, das nicht mehr laeuft, erklaert nichts, was `git` nicht haelt. Lebende Artefakte (AGENTS.md, Spec, offener Slice) verlinken `harness/sensors/<target>.md` direkt; der Bruch des Links bei der Retirierung ist dort das gewollte Signal (ein Zeiger auf ein nicht mehr existierendes Gate behauptet eine Deckung, die nicht mehr besteht), der Zeiger darf dort nachgezogen werden. Einfrierende Zeitdokumente (Review-Report, Closure-Notiz, Archiv-Stub, Accepted-ADR, geschlossener Slice) nennen `make <target>` als Token statt der Sensor-Datei und werden nicht nachgezogen. grundlagen-harness-dateien.md §harness/README.md als Einstiegspunkt (Absaetze "Kein Verzeichnis-Lifecycle: ein retiriertes Gate ist weg" und "Deshalb wird die Datei direkt adressiert"), v6.10.0.
      Beispiel fuer eine RICHTIGE Antwort: Ein done/-Verzeichnis oder ein Status- bzw. Datumsfeld (deprecated) gibt es fuer Gates im Harness nicht. Streicht die Zeile aus der Sensors-Tabelle und entfernt harness/sensors/mutation.md; was das Gate war, haelt git. Die Verweise in AGENTS.md und spec/spezifikation.md sind lebende Artefakte: dort wird der Zeiger nachgezogen (der Link auf mutation.md entfaellt); dass der Link-Sensor dabei rot wird, ist das gewollte Signal. Slice-031 und der Review-Report sind eingefroren und nennen nur `make mutation` als Token, die bleiben unveraendert.
      Beispiel fuer eine FALSCHE Antwort: Markiert die Zeile als deprecated und verschiebt die Datei nach harness/sensors/archive/ oder done/, damit die Historie erhalten bleibt. Danach biegt ihr alle Verweise, auch in slice-031 und im Review-Report, auf den Archivpfad um, damit keine Links brechen.
      Kriterium: Die Antwort trifft dieselbe Kernentscheidung wie die Referenz: Zeile und Datei verschwinden (kein done/-Verzeichnis-Lifecycle, kein Status-/deprecated-Vermerk), und die Verweise werden nach lebend/eingefroren unterschieden (bei lebenden den Zeiger nachziehen, geschlossene Zeitdokumente nicht nachziehen). Formulierung, Synonyme, zusaetzliche korrekte Details und die Reihenfolge der Saetze sind unerheblich. Die Antwort besteht NICHT, wenn sie ein Archiv-/done/-Verzeichnis, einen Status-/deprecated-Vermerk oder das Nachziehen bzw. Umbiegen geschlossener Dokumente empfiehlt, der Referenz sonst widerspricht oder nur Randbegriffe nennt.
      Bei Erfuellung rufe set_waza_grade_pass auf, sonst set_waza_grade_fail mit einer Begruendung in einem Satz.
