id: tr-04-001
name: Herkunfts-Anker in AGENTS.md
description: |
  Prueft den Herkunfts-Anker fuer Steering-Loop-Regeln (grundlagen-traceability.md §Herkunfts-Anker fuer
  Steering-Loop-Regeln, v6.10.0). Nur Regeln, die die 3x-Schwelle erreicht haben, tragen `seit welle-<Kennung>`;
  die Welle ist der Regelfall, `seit slice-<Kennung>` nur bei wellenlos verkoerperten Regeln (Kennung = Dateiname).
  Regeln aus Lastenheft/Spec/ADR tragen schon eine ID und brauchen keinen zweiten Anker. Ab Einfuehrung,
  kein Nachruesten: `seit unbekannt` waere eine Harness-Luege, der leere Zustand ist die ehrliche Information.
  Fixture: AGENTS.md-Auszug mit fuenf Kandidaten (ADR-Regel, Welle-Regel, wellenlose Regel, Altregel ohne Ursprung,
  Beobachtung unter der Schwelle).
  Ohne Regelwerk antwortet ein Modell typischerweise: alle Regeln mit Herkunft versehen, bei der Welle-Regel die
  Slice-Kennung nennen und fuer die Altregel "seit unbekannt" oder eine Schaetzung eintragen. Das ist hier falsch,
  weil der Anker auf die Welle zeigt (Slice nur ohne Welle), nur schwellen-erreichende Steering-Loop-Regeln ihn
  tragen und Nachruesten ausgeschlossen ist.
  Bewertung: Der LLM-Judge entscheidet; die Regex ist nur eine Plausibilitaetspruefung.
tags:
- tr-04
- stufe-3
- tr
inputs:
  prompt: 'Nach dem AI-Harness-Regelwerk: Wir wollen in unserer AGENTS.md nachvollziehbar machen, woher die Regeln stammen (siehe Datei, Vorschlag am Ende). Bei welchen der fuenf Punkte tragen wir eine Herkunftsangabe ein, mit welchem genauen Wortlaut, und was machen wir mit den uebrigen?'
  files:
  - path: tr-04-agents-regeln.md
expected:
  outcomes:
  - type: task_completed
graders:
- type: text
  name: anker_welle_regelfall
  config:
    regex_match:
    - (?i)seit[\s`]+welle-cache-warmup
- type: prompt
  name: judge_tr_04_001
  config:
    model: minimax-m3:cloud
    continue_session: true
    prompt: |
      Du bewertest die letzte Antwort eines KI-Agenten auf eine Frage zum AI-Harness-Regelwerk.
      Referenz (laut Regelwerk): Herkunfts-Anker nur fuer Regeln, die die 3x-Schwelle erreicht haben; Form `seit welle-<Kennung>`; die Welle ist der Regelfall, `seit slice-<Kennung>` die Ausnahme fuer wellenlos verkoerperte Regeln (Kennung = Dateiname). Was aus Lastenheft, Spec oder ADR folgt, traegt bereits eine ID und braucht keinen zweiten Anker. Ab Einfuehrung, kein Nachruesten: Bestehende Regeln ohne rekonstruierbaren Ursprung bekommen nichts; `seit unbekannt` waere eine Harness-Luege, der leere Zustand ist die ehrliche Information. Uebertragen auf die Fixture: 3.1 kein Anker (ADR-0007/LH-QA-SUP-002); 3.2 `seit welle-cache-warmup` (nicht die Slice-Kennungen); 3.3 `seit slice-audit-log-hardening` (wellenlos); 3.4 kein Anker, leer lassen, kein "seit unbekannt"; Zeitzonen-Fehler (2x) noch keine Regel, bleibt Beobachtung im Register (grundlagen-traceability.md §Herkunfts-Anker fuer Steering-Loop-Regeln, v6.10.0).
      Beispiel fuer eine RICHTIGE Antwort: Nur zwei Regeln bekommen einen Anker: 3.2 mit `(seit welle-cache-warmup)`, weil bei Wellen die Welle der Anker ist und nicht die einzelnen Slices, und 3.3 mit `(seit slice-audit-log-hardening)`, weil sie ohne Welle verkoerpert wurde. 3.1 folgt aus ADR und Lastenheft und traegt schon eine ID, braucht keinen zweiten Anker. 3.4 bleibt ohne Angabe, denn Nachruesten gibt es nicht; ein "seit unbekannt" waere eine Luege, der leere Zustand ist die ehrliche Information. Der Zeitzonen-Fehler ist erst zweimal aufgetreten, also noch keine Regel und kein Anker, er bleibt im Beobachtungs-Register.
      Beispiel fuer eine FALSCHE Antwort: Jede Regel bekommt ein seit-Feld: 3.1 seit ADR-0007, 3.2 seit slice-cache-warmup-ttl, 3.3 seit slice-audit-log-hardening, und 3.4 seit unbekannt, damit man sieht, dass der Ursprung fehlt. Fuer die Zeitzonen-Beobachtung legen wir vorsorglich eine Regel mit Anker an.
      Kriterium: Die Antwort trifft im Kern dieselben Entscheidungen wie die Referenz: 3.2 mit welle-cache-warmup (nicht Slice), 3.3 mit slice-audit-log-hardening, und die Altregel 3.4 ohne Anker bzw. ausdruecklich ohne "seit unbekannt". Wer 3.1 oder die Zeitzonen-Beobachtung mit einem Anker versieht, verfehlt die Referenz ebenfalls. Formulierung und Reihenfolge sind unerheblich. Die Antwort besteht NICHT, wenn sie der Referenz widerspricht oder nur allgemein "Herkunft dokumentieren" sagt.
      Bei Erfuellung rufe set_waza_grade_pass auf, sonst set_waza_grade_fail mit einer Begruendung in einem Satz.
