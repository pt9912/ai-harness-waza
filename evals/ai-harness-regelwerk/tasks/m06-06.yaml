id: m06-06-001
name: Wellenlose Arbeit in der Roadmap
description: |
  Prueft Regel M06-06 (modul-06-roadmap.md v6.10.0, §Wann Arbeit eine Welle braucht,
  Bullets "Wellenlose Arbeit erscheint nicht in der Roadmap", "Vorwaerts-Blick" und
  "Einzige Beruehrung mit der Roadmap"): Wellenlose Arbeit steht weder beim Start
  noch beim Abschluss in der Roadmap (keine Ein-Slice-Welle, kein Eintrag unter
  Offene/Abgeschlossene Wellen); "was laeuft" beantwortet `ls
  docs/plan/planning/in-progress/` auf dem Hauptzweig. Liefert sie den letzten Beleg
  eines Meilensteins, bleibt die Spalte `Welle(n)` leer (`—`) und die Slice-ID steht
  als Beleg daneben. Fixture: Roadmap-Entwurf, M3 haengt an wellenlosem slice-export-csv.
  Ohne Regelwerk antwortet ein Modell typischerweise: eine Ein-Slice-Welle anlegen (oder
  den Slice unter Offene Wellen fuehren), damit Meilenstein und Sichtbarkeit sauber
  verdrahtet sind, und die Welle(n)-Zelle mit dieser Welle fuellen. Das ist hier falsch:
  Ohne repo-weites Mehr ueber die DoD hinaus gibt es keine Welle, die Roadmap fuehrt keine
  wellenlose Arbeit, und die Meilenstein-Zeile traegt `—` mit der Slice-ID als Beleg.
    Bewertung: Der LLM-Judge entscheidet; die verbleibende Regex ist nur eine Plausibilitaetspruefung der Kernaussage.
tags:
- m06-06
- stufe-2
- modul-06
- fixture
inputs:
  prompt: 'Nach dem AI-Harness-Regelwerk: In der Datei steht unser Roadmap-Entwurf samt Notiz der Projektleitung zu slice-export-csv. Wie tragen wir diesen Slice und den Meilenstein M3 in die Roadmap ein, und wie machen wir sichtbar, dass der Slice gerade laeuft?'
  files:
  - path: m06-06-roadmap-entwurf.md
expected:
  outcomes:
  - type: task_completed
graders:
- type: text
  name: meilenstein_zelle_und_kein_eintrag
  config:
    regex_match:
    - '(?i)welle\(n\)[^\n]{0,120}(leer|—|–|strich|nichts|frei)'
- type: prompt
  name: judge_m06_06_001
  config:
    model: kimi-k2.7-code:cloud
    continue_session: true
    prompt: |
      Du bewertest die letzte Antwort eines KI-Agenten auf eine Frage zum AI-Harness-Regelwerk.
      Referenz (laut Regelwerk): slice-export-csv hat keinen Trigger, der mehr belegt als seine eigene DoD, also keine Welle. Wellenlose Arbeit erscheint nicht in der Roadmap, weder beim Start noch beim Abschluss: keine Ein-Slice-Welle, kein Eintrag unter Offene Wellen oder Abgeschlossene Wellen. Was gerade laeuft, beantwortet `ls docs/plan/planning/in-progress/` auf dem Hauptzweig (Zustand = Verzeichnis-Position; ein Roadmap-Eintrag waere eine zweite Quelle). Einzige Beruehrung mit der Roadmap: Liefert der Slice den letzten Beleg eines Meilensteins, bleibt in dessen Zeile die Spalte `Welle(n)` leer (`—`) und die Slice-ID steht als Beleg daneben. modul-06-roadmap.md §Wann Arbeit eine Welle braucht (Bullets "Wellenlose Arbeit erscheint nicht in der Roadmap" und "Einzige Beruehrung mit der Roadmap"), v6.10.0.
      Beispiel fuer eine RICHTIGE Antwort: Der Slice bekommt keine Welle, denn sein Abschluss belegt nichts ueber die eigene DoD hinaus. Er kommt deshalb nicht in die Roadmap, weder unter Offene noch unter Abgeschlossene Wellen; dass er laeuft, zeigt `ls docs/plan/planning/in-progress/` auf dem Hauptzweig, eine Extra-Liste waere eine zweite Quelle. In der Meilenstein-Tabelle bleibt bei M3 die Spalte Welle(n) leer (`—`), und die Slice-ID slice-export-csv steht als Beleg daneben.
      Beispiel fuer eine FALSCHE Antwort: Legt eine Welle welle-export mit dem einen Slice an und fuehrt sie unter Offene Wellen, damit die Projektleitung den Stand sieht. Bei M3 traegt ihr in Welle(n) die welle-export ein, und nach dem Abschluss kommt sie ins Closure-Log unter Abgeschlossene Wellen.
      Kriterium: Die Antwort trifft dieselbe Kernentscheidung wie die Referenz: keine Welle und kein Roadmap-Eintrag fuer den Slice; bei M3 bleibt Welle(n) leer (`—`) mit der Slice-ID daneben; Sichtbarkeit ueber das Verzeichnis in-progress/. Formulierung, Synonyme, zusaetzliche korrekte Details und die Reihenfolge der Saetze sind unerheblich. Die Antwort besteht NICHT, wenn sie eine (Ein-Slice-)Welle oder einen Roadmap-Eintrag fuer den Slice empfiehlt, der Referenz sonst widerspricht oder nur Randbegriffe nennt.
      Bei Erfuellung rufe set_waza_grade_pass auf, sonst set_waza_grade_fail mit einer Begruendung in einem Satz.
