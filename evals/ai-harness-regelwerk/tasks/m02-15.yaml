id: m02-15-001
name: Bootstrap-Ende bei vollem Reconciliation-Register
description: |
  Prueft Regel M02-15 (modul-02-harness-bootstrap.md, Stufe 2): Der
  Reconciliation-Backlog "steht", wenn JEDE Zeile ihre Aufloesung traegt. Zwei
  Zeilen ohne Aufloesung blockieren das Bootstrap-Ende; das Register muss aber
  nicht leer sein. Anerkannte Aufloesungen: Carveout mit Folge-Slice,
  Reconciliation-Slice, retroaktive ADR.
    Bewertung: Der LLM-Judge entscheidet; die verbleibende Regex ist nur eine Plausibilitaetspruefung der Kernaussage.
tags:
- m02-15
- stufe-2
- modul-02
inputs:
  prompt: 'Nach dem AI-Harness-Regelwerk: Wir bootstrappen ein bestehendes Repo (viel Altcode) und sind bei der Inventur-Nacharbeit. In unserer Registerdatei fuer Funde stehen 14 Zeilen. Bei zwoelf ist eine Aufloesung eingetragen, bei zwei steht nur Klaeren wir spaeter. Ist damit die Bootstrap-Phase abgeschlossen? Und welche Arten von Aufloesung erkennt das Regelwerk fuer eine Zeile an?'
expected:
  outcomes:
  - type: task_completed
graders:
- type: text
  name: bootstrap_ende_kern
  config:
    regex_match:
    - (?i)(retroaktiv|reconciliation-?slice)
- type: prompt
  name: judge_m02_15_001
  config:
    model: kimi-k2.7-code:cloud
    continue_session: true
    prompt: |
      Du bewertest die letzte Antwort eines KI-Agenten auf eine Frage zum AI-Harness-Regelwerk.
      Referenz (laut Regelwerk): Nein, noch nicht abgeschlossen: der Backlog "steht" erst, wenn jede Zeile ihre Aufloesung traegt; die zwei Zeilen ohne Aufloesung (nur "spaeter klaeren") blockieren das Bootstrap-Ende. Das Register muss dagegen nicht leer sein (leer wird es je Sub-Area erst bei der Graduation). Anerkannte Aufloesungen: Carveout mit Folge-Slice, Reconciliation-Slice oder retroaktive ADR. modul-02-harness-bootstrap.md §Das Reconciliation-Register (Absatz "Der Backlog steht") und Tabelle Bootstrap-Ende; grundlagen-bootstrap.md §Bootstrap-Ende.
      Beispiel fuer eine RICHTIGE Antwort: Nein, noch nicht. Bootstrap-Ende heisst nicht, dass das Register leer sein muss, sondern dass jede Zeile ihre Aufloesung traegt. Die zwei Zeilen mit "Klaeren wir spaeter" haben keine; sie muessen zuerst eine bekommen. Anerkannt sind ein Carveout mit Folge-Slice, ein Reconciliation-Slice oder eine retroaktive ADR. Danach ist der Bootstrap fertig, auch wenn die Zeilen noch offen sind.
      Beispiel fuer eine FALSCHE Antwort: Ja, zwoelf von vierzehn reichen, der Rest ist Kleinkram und kann spaeter geklaert werden. Als Aufloesung zaehlt jede Notiz in der Zeile, etwa ein Kommentar oder ein Ticket-Link; ein Carveout oder eine ADR ist nicht noetig.
      Kriterium: Die Antwort trifft dieselbe Kernentscheidung wie die Referenz. Formulierung, Synonyme, zusaetzliche korrekte Details und die Reihenfolge der Saetze sind unerheblich. Die Antwort besteht NICHT, wenn sie der Referenz widerspricht, die Kernentscheidung verfehlt oder nur Randbegriffe nennt oder nicht nennt, dass die zwei Zeilen ohne Aufloesung das Bootstrap-Ende blockieren, oder die anerkannten Aufloesungsarten (Carveout mit Folge-Slice, Reconciliation-Slice, retroaktive ADR) verfehlt.
      Bei Erfuellung rufe set_waza_grade_pass auf, sonst set_waza_grade_fail mit einer Begruendung in einem Satz.
