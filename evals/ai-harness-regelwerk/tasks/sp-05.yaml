id: sp-05-001
name: Lastenheft Accepted - neue Anforderung und Berichtigungen
description: |
  Prueft die Lastenheft-Aenderungsregel in grundlagen-source-precedence.md §Spec-Stratifizierung
  (Absaetze "Wann die CR-Pflicht beginnt" und "Die eine Ausnahme ist die Tatsachenberichtigung",
  v6.10.0; Form-Details in templates/spec/lastenheft.template.md §7 Historie). Ab Status Accepted ist
  JEDE Aenderung eine Vertragsaenderung, auch das blosse Hinzufuegen einer neuen LH-*. Einzige Ausnahme:
  Tatsachenberichtigung, die in der Historie als solche ausgewiesen ist, keine Aussage einer Anforderung
  beruehrt und in "Verweis" `—` traegt. Fixture: Lastenheft (Accepted) mit drei Aenderungswuenschen:
  neue Anforderung (CR noetig), falscher Auftraggeber-Name im Zweck-Abschnitt (Berichtigung ohne CR),
  falsche Frist in einer Anforderung (beruehrt Aussage, CR trotz "Tippfehler"-Etikett).
  Ohne Regelwerk antwortet ein Modell typischerweise: eine rein additive neue Anforderung sei unkritisch
  bzw. jede offensichtliche Korrektur gegen den Vertrag duerfe direkt rein. Das ist hier falsch, weil
  "neu" keine Ausnahme ist und eine Zahlenkorrektur in einer Anforderung deren Aussage beruehrt.
  Bewertung: Der LLM-Judge entscheidet; die Regex ist nur eine Plausibilitaetspruefung.
    Judge-Kriterium verlangt zusaetzlich die Regelwerk-Details (Ausweis als Tatsachenberichtigung, Verweis, eigener Commit), nicht nur die grobe Einteilung.
tags:
- sp-05
- stufe-3
- source-precedence
inputs:
  prompt: 'Nach dem AI-Harness-Regelwerk: Unser Lastenheft hat den Status Accepted. Kollege Meier hat in der Datei drei Aenderungswuensche notiert. Welche davon duerfen wir direkt im Lastenheft umsetzen, fuer welche brauchen wir einen vorgelagerten Vorgang, und was tragen wir jeweils in die Historie ein? Auftraggeber und Entwickler sind bei uns dieselbe Person.'
  files:
  - path: sp-05-lastenheft-aenderungen.md
expected:
  outcomes:
  - type: task_completed
graders:
- type: text
  name: berichtigung_ohne_cr_ausgewiesen
  config:
    regex_match:
    - (?i)(tatsachenberichtigung|berichtigung)[^\n]{0,250}(ausgewiesen|historie|verweis|kein\w*\s+(change[- ]request|cr))|(ausgewiesen|historie|verweis)[^\n]{0,250}berichtigung
- type: prompt
  name: judge_sp_05_001
  config:
    model: kimi-k2.7-code:cloud
    continue_session: true
    prompt: |
      Du bewertest die letzte Antwort eines KI-Agenten auf eine Frage zum AI-Harness-Regelwerk.
      Referenz (laut Regelwerk): Ab Status Accepted ist JEDE Aenderung am Lastenheft eine Vertragsaenderung, auch das Hinzufuegen einer neuen LH-*; "neu" ist keine Ausnahme. Sie braucht einen Change Request (Fussabdruck: Version-Bump plus Historie-Zeile mit dem CR unter "Verweis"). Fallen Auftraggeber und Entwickler zusammen, traegt der Commit die Trennung: eigener Commit, der ausschliesslich das Lastenheft aendert, vor dem Slice, der es umsetzt; "Verweis" nennt diesen Vorgang. Einzige Ausnahme ist die Tatsachenberichtigung (eine Stelle behauptete etwas anderes als vereinbart): kein CR noetig, wenn sie in der Historie ALS SOLCHE ausgewiesen ist und KEINE Aussage einer Anforderung beruehrt; "Verweis" traegt dann "—". Uebertragen auf die Fixture: (1) neue LH-QA-SUP-010 = CR-pflichtig; (2) falscher Auftraggeber-Name im Zweck-Abschnitt = Tatsachenberichtigung ohne CR, in der Historie als Berichtigung ausgewiesen, Verweis "—"; (3) 14 statt 10 Tage in LH-FA-IDX-003 beruehrt die Aussage einer Anforderung, ist also trotz "Tippfehler"-Etikett eine Vertragsaenderung mit CR (grundlagen-source-precedence.md §Spec-Stratifizierung, "Wann die CR-Pflicht beginnt" und "Die eine Ausnahme ist die Tatsachenberichtigung", v6.10.0; templates/spec/lastenheft.template.md §7 Historie).
      Beispiel fuer eine RICHTIGE Antwort: Nur der Namensfehler im Zweck-Abschnitt darf ohne Change Request direkt korrigiert werden: Das ist eine Tatsachenberichtigung, die in der Historie ausdruecklich als solche ausgewiesen wird, mit "—" unter Verweis. Die neue LH-QA-SUP-010 braucht einen Change Request, denn ab Accepted ist auch das Hinzufuegen eine Vertragsaenderung. Die 14-auf-10-Tage-Korrektur beruehrt die Aussage einer Anforderung; sie ist keine blosse Berichtigung, sondern ebenfalls eine Vertragsaenderung. Da ihr dieselbe Person seid, gehen die CR-Aenderungen in einen eigenen Commit, der nur das Lastenheft aendert, vor den umsetzenden Slice, mit Version-Bump und Historie-Zeile, die diesen Vorgang nennt.
      Beispiel fuer eine FALSCHE Antwort: Die neue Anforderung LH-QA-SUP-010 ist rein additiv und aendert nichts Bestehendes, die kann direkt ins Lastenheft. Die beiden Abschreibfehler sind offensichtliche Korrekturen gegen den unterschriebenen Vertrag und duerfen ebenfalls direkt gemacht werden; in die Historie kommt ein Eintrag mit Version-Bump und Verweis auf V-2025-114. Bei den Aenderungen genuegt ein Commit zusammen mit dem Slice.
      Kriterium: Die Antwort trifft die Kernentscheidungen der Referenz UND nennt die Regelwerk-spezifischen Details: (1) ab Accepted braucht jede Aenderung, auch eine neue LH-*, einen Change Request; (2) nur die Namenskorrektur ist eine Tatsachenberichtigung ohne CR, in der Historie ALS SOLCHE ausgewiesen, mit Verweis "—"; (3) die Frist-Aenderung beruehrt eine Anforderungsaussage und braucht trotz "Tippfehler" einen CR; (4) bei Personalunion traegt der Commit die Trennung: ein eigener Commit nur fuer das Lastenheft vor dem Slice. Formulierung, Synonyme und die Reihenfolge sind unerheblich. Die Antwort besteht NICHT, wenn eines dieser Details fehlt oder falsch ist, auch wenn die grobe Einteilung (direkt/Vorgang) stimmt.
      Bei Erfuellung rufe set_waza_grade_pass auf, sonst set_waza_grade_fail mit einer Begruendung in einem Satz.
