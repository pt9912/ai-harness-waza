id: sp-11-001
name: Solo-Entwickler aendert Lastenheft und Umsetzung
description: |
  Prueft SP-11 (grundlagen-source-precedence.md, Stufe 3): Fallen Auftraggeber- und Entwickler-Rolle
  zusammen, entfaellt die Trennung nicht; ein angenommener CR aendert in eigenem Commit ausschliesslich
  das Lastenheft und liegt vor dem umsetzenden Slice. Kein Sensor, sondern Review-Griff.
  Grader (Regex): (1) nicht zulaessig, (2) eigener/getrennter Commit fuer die Lastenheft-Aenderung,
  (3) dieser Commit liegt vor dem umsetzenden Slice bzw. der Umsetzung. "Review-Griff" wird nicht mehr
  verlangt, da der Prompt die Durchsetzungsfrage nicht stellt.
tags:
- sp-11
- stufe-3
- source-precedence
inputs:
  prompt: 'Nach dem AI-Harness-Regelwerk: Ich bin Solo-Entwickler und zugleich mein eigener Auftraggeber, es gibt kein Ticketsystem. Das Lastenheft steht auf Accepted. Ich will LH-FA-07 aendern und die Umsetzung im Code gleich im selben Commit mitliefern, weil ich ja niemandem Rechenschaft schulde. Ist das so zulaessig, und wie sieht das saubere Vorgehen aus?'
expected:
  outcomes:
  - type: task_completed
graders:
- type: text
  name: trennung_per_commit
  config:
    regex_match:
    - (?i)(nicht\s+([^\s.,;:()]+\s+){0,2}zul(ä|ae)ssig|unzul(ä|ae)ssig|\bnein\b|nicht\s+(so\s+)?(erlaubt|m(ö|oe)glich|sauber|konform|regelkonform)|geht\s+nicht|nicht\s+(im\s+)?selben\s+commit)
- type: prompt
  name: judge_sp_11_001
  config:
    model: minimax-m3:cloud
    continue_session: true
    prompt: |
      Du bewertest die letzte Antwort eines KI-Agenten auf eine Frage zum AI-Harness-Regelwerk.
      Referenz (laut Regelwerk): Nicht zulaessig. Trennung von Entscheidung und Umsetzung bleibt auch ohne Ticket: Der angenommene CR aendert in einem eigenen Commit ausschliesslich das Lastenheft und liegt vor dem umsetzenden Slice; Verweis-Spalte nennt diesen Vorgang statt Ticket. Ein Sensor dafuer existiert nicht, es bleibt ein Review-Griff (SP §Spec-Stratifizierung, Absatz "Fallen Auftraggeber- und Entwickler-Rolle zusammen"; Status Accepted -> jede Aenderung ist Vertragsaenderung).
      Beispiel fuer eine RICHTIGE Antwort: Nein, so ist das nicht zulaessig. Dass du selbst der Auftraggeber bist, hebt die Trennung von Entscheidung und Umsetzung nicht auf, es fehlt nur die Ticket-Form. Erst kommt die Aenderung an LH-FA-07 als eigener Commit, der ausschliesslich das Lastenheft beruehrt, samt Historie-Zeile und Version-Bump. Danach folgt in einem separaten Commit der Slice, der die Aenderung im Code umsetzt.
      Beispiel fuer eine FALSCHE Antwort: Ja, das ist zulaessig. Wenn du Auftraggeber und Entwickler zugleich bist, gibt es niemanden, dem du Rechenschaft schuldest, und ein Change Request waere reine Buerokratie. Du kannst LH-FA-07 und die Umsetzung in einem einzigen Commit liefern und die Aenderung in der Commit-Message beschreiben.
      Kriterium: Die Antwort trifft dieselbe Kernentscheidung wie die Referenz. Formulierung, Synonyme, zusaetzliche korrekte Details und die Reihenfolge der Saetze sind unerheblich. Die Antwort besteht NICHT, wenn sie der Referenz widerspricht, die Kernentscheidung verfehlt oder nur Randbegriffe nennt.
      Bei Erfuellung rufe set_waza_grade_pass auf, sonst set_waza_grade_fail mit einer Begruendung in einem Satz.
