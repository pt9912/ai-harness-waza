id: ds-07-001
name: Drei Bindepunkte - Quadranten und der schwaechste
description: |
  Prueft DS-07 (grundlagen-durchsetzungsschicht.md §Drei Bindepunkte, v6.10.0):
  Tool-Call-Gate = computational feedforward, Handoff-Gate = computational
  feedback, Workflow-Skelett (Slash-Command) = inferential feedforward; nur die
  zwei Gates erzwingen, das Skelett ist der schwaechste Bindepunkt, gibt den
  Ablauf nur vor und kann ignoriert werden. Ein uebersprungener Schritt wird
  daher nicht durch eine haertere Formulierung im Skelett geschlossen, und
  "alle drei erzwungen" in der Doku waere falsch.
  Ohne Regelwerk antwortet ein Modell typischerweise, ein Slash-Command sei
  "nur ein Prompt" und man solle ihn stark formulieren oder den Stop-Hook um
  einen Test-Check erweitern, und es ordnet die Stellen nicht (oder falsch) den
  Quadranten der 2x2-Matrix zu. Das ist hier unvollstaendig: das Regelwerk
  verlangt die feste Zuordnung aller drei Bindepunkte und die Korrektur der
  Doku-Aussage, nicht bloss ein schaerferes Skelett.
tags: [ds-07, stufe-3, ds]
inputs:
  prompt: >-
    Nach dem AI-Harness-Regelwerk: Siehe Datei (Durchsetzungs-Uebersicht und
    Vorfall-Notiz). Ordne die drei Stellen, an denen wir den Agenten binden,
    jeweils einem Quadranten der 2x2-Matrix zu und sag, welche davon wirklich
    erzwingt und welche nicht. Stimmt der Absatz "alle drei erzwungen", und
    ist der Vorschlag aus der Vorfall-Notiz die richtige Reaktion auf den
    uebersprungenen Schritt 2?
  files:
    - path: ds-07-durchsetzung-uebersicht.md
expected:
  outcomes:
    - type: task_completed
graders:
  - type: text
    name: skelett_inferential_schwaechster
    config:
      regex_match:
        - (?i)(skelett|slash[- ]?command)[^\n]{0,200}(inferential|schw(ö|oe|ä|ae)chst|nicht erzwing)|(inferential|schw(ö|oe|ä|ae)chst)[^\n]{0,200}(skelett|slash[- ]?command)
  - type: prompt
    name: judge_ds_07_001
    config:
      model: kimi-k2.7-code:cloud
      continue_session: true
      prompt: |
        Du bewertest die letzte Antwort eines KI-Agenten auf eine Frage zum AI-Harness-Regelwerk.
        Referenz (laut Regelwerk): Die drei Bindepunkte und ihre Quadranten: Tool-Call-Gate (PreToolUse-Hook / Befehls-Guard) = computational FEEDFORWARD (falsche Handlung technisch verhindern); Handoff-Gate (Stop-Hook) = computational FEEDBACK (deterministisch pruefen, dass die Gates wirklich liefen); Workflow-Skelett (Slash-Command, hier /slice) = INFERENTIAL feedforward (gibt den Ablauf vor). Nur die zwei Gates erzwingen; das Workflow-Skelett ist der SCHWAECHSTE Bindepunkt: es erzwingt nicht und ist das einzige der drei, das ein Agent noch ignorieren kann. Damit stimmt "alle drei erzwungen" nicht, der Absatz muss korrigiert werden. Der Vorfall (Schritt 2 uebersprungen, Gates gruen, Stop-Hook gibt frei) ist genau diese Eigenschaft des Skeletts. Folgerung aus dieser Einstufung (kein woertliches Regelwerk-Zitat): "Schritt 2 ist zwingend!" im Command-Text bleibt inferential feedforward, informiert nur und erzwingt nichts, ist also keine wirksame Reaktion. Fundstelle: grundlagen-durchsetzungsschicht.md §Drei Bindepunkte (Tabelle und Folgeabsatz, v6.10.0).
        Beispiel fuer eine RICHTIGE Antwort: Tool-Call-Gate (PreToolUse) ist computational feedforward, es verhindert die Handlung vorab. Das Handoff-Gate (Stop-Hook) ist computational feedback, es prueft nachtraeglich deterministisch, dass die Gates liefen. Der Slash-Command /slice ist das Workflow-Skelett und inferential feedforward: er gibt die Schrittfolge nur vor. Erzwungen wird also nur durch die zwei Gates; das Skelett ist der schwaechste Bindepunkt und kann vom Agenten ignoriert werden, wie der Vorfall zeigt. Der Absatz "alle drei erzwungen" ist falsch und muss korrigiert werden. Ein haerterer Satz im Command-Text aendert daran nichts, er bleibt inferential; der uebersprungene Schritt wird nicht dadurch geschlossen.
        Beispiel fuer eine FALSCHE Antwort: Der Slash-Command ist nur ein Prompt und daher der schwache Punkt, deshalb sollte man Schritt 2 im Text fett und als Pflicht markieren und den Stop-Hook so erweitern, dass er zusaetzlich prueft, ob zu jedem Slice ein Test existiert. Die beiden Hooks sind erzwungen, der Slash-Command eben nur ein Hinweis; ein Quadrant-Schema braucht es dafuer nicht. Mit diesen Aenderungen kann der Absatz "alle drei erzwungen" stehen bleiben.
        Kriterium: Die Antwort nennt die REGELWERK-SPEZIFISCHEN Details, nicht nur die grobe Einteilung "Hooks stark, Command schwach": (1) Tool-Call-Gate = computational feedforward UND Handoff-Gate = computational feedback (die beiden nicht vertauscht oder beide als "feedforward" bezeichnet); (2) Workflow-Skelett/Slash-Command = inferential feedforward, der schwaechste Bindepunkt, weil er den Ablauf nur vorgibt und ignoriert werden kann; (3) "alle drei erzwungen" ist falsch, es erzwingen nur die zwei Gates; (4) die Formulierungs-Verschaerfung im Command ist keine wirksame Antwort auf den Vorfall (bleibt inferential). Formulierung, Synonyme und Reihenfolge sind unerheblich. Die Antwort besteht NICHT, wenn eine Quadrant-Zuordnung fehlt oder falsch ist, den Absatz "alle drei erzwungen" bestaetigt oder die Verschaerfung des Textes als Loesung ausgibt, auch wenn das Skelett als schwach erkannt wird.
        Bei Erfuellung rufe set_waza_grade_pass auf, sonst set_waza_grade_fail mit einer Begruendung in einem Satz.
timeout_seconds: 300
