id: ds-07-001
name: Handoff-Gate - Grenze des Inhalts-Nachweises
description: |
  Prueft DS-07 (grundlagen-durchsetzungsschicht.md §Nachweis ueber Inhalt und
  §Grenzen - ehrlich benannt, v6.10.0): Der Inhalts-Nachweis (Content-Hash) des
  Handoff-Gates hat eine Luecke bei frischem Klon bzw. geloeschtem State mit
  cleanem Tree - dort ist kein Nachweis pruefbar und CI ist das Netz; die Grenze
  muss benannt werden, eine Garantie-Aussage darueber hinaus ist eine Harness-Luege.
  Ohne Regelwerk antwortet ein Modell typischerweise, die Zusicherung sei im
  Kern in Ordnung und der Hook muesse nur strenger werden (bei fehlendem State
  blockieren bzw. Gates selbst nachlaufen lassen), oder es empfiehlt allgemein
  "mehr Tests". Das ist hier unvollstaendig: laut Regelwerk ist die Luecke
  systembedingt, wird nicht im Hook geschlossen, sondern von CI aufgefangen, und
  die README-Garantie muss auf die Grenze zurueckgenommen werden.
tags: [ds-07, stufe-3, ds]
inputs:
  prompt: >-
    Nach dem AI-Harness-Regelwerk: Siehe Datei (Hook-README und Log). Im Log
    vom 4. Maerz hat der Stop-Hook den Agenten durchgelassen, obwohl er keine
    Gate-Ausfuehrung belegen konnte. Ist die "Garantie" im README so
    korrekt? Was aendern wir am README, und was faengt den Fall ab?
  files:
    - path: ds-07-handoff-gate-readme.md
expected:
  outcomes:
    - type: task_completed
graders:
  - type: text
    name: luecke_ci_netz
    config:
      regex_match:
        - (?i)\bCI\b
  - type: prompt
    name: judge_ds_07_001
    config:
      model: minimax-m3:cloud
      continue_session: true
      prompt: |
        Du bewertest die letzte Antwort eines KI-Agenten auf eine Frage zum AI-Harness-Regelwerk.
        Referenz (laut Regelwerk): Die Garantie im README ist zu stark und damit selbst eine Harness-Luege. Der Inhalts-Nachweis (Content-Hash) hat eine bekannte Luecke bei frischem Klon bzw. geloeschtem State mit cleanem Tree: dort ist kein Nachweis pruefbar. Diese Grenze muss im README benannt werden (Pflicht), und das Netz dafuer ist CI (nicht der Hook). Fundstelle: grundlagen-durchsetzungsschicht.md §Vier Design-Eigenschaften Punkt 2 und §Grenzen - ehrlich benannt (v6.10.0).
        Beispiel fuer eine RICHTIGE Antwort: Nein, die Garantie stimmt so nicht. Der Nachweis ist ein Content-Hash ueber den Arbeitsbaum; bei frischem Klon (State fehlt, Tree clean) laesst sich nichts pruefen, wie das Log vom 4. Maerz zeigt. Das README muss diese Grenze ausdruecklich nennen, statt mehr zu versprechen, sonst ist die Zusicherung eine Harness-Luege. Aufgefangen wird der Fall nicht durch den Hook, sondern durch CI, die die Gates auf dem Stand erneut laufen laesst.
        Beispiel fuer eine FALSCHE Antwort: Die Garantie ist im Kern richtig, aber der Hook sollte bei fehlender gates.sha strikt blockieren und die Gates selbst nachlaufen lassen. Ausserdem sollte man .claude/state ins Repo committen und ein Audit-Log fuehren. Dann ist der Fall geschlossen und die Garantie kann stehen bleiben.
        Kriterium: Die Antwort trifft dieselbe Kernentscheidung wie die Referenz, nennt also (1) die Garantie ist zu stark bzw. der Nachweis hat hier eine Luecke (frischer Klon/State weg, kein Nachweis pruefbar) und (2) CI ist das Netz dafuer, wobei die Grenze im README benannt werden soll. Formulierung, Synonyme, zusaetzliche korrekte Details und die Reihenfolge der Saetze sind unerheblich. Die Antwort besteht NICHT, wenn sie der Referenz widerspricht (z. B. die Garantie bestaetigt oder die Luecke allein im Hook schliessen will), CI als Netz nicht nennt oder nur Randbegriffe nennt.
        Bei Erfuellung rufe set_waza_grade_pass auf, sonst set_waza_grade_fail mit einer Begruendung in einem Satz.
timeout_seconds: 300
