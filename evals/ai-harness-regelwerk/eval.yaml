name: ai-harness-regelwerk-eval
description: Verhaltenstests fuer den Regelwerk-Skill (echtes Modell via copilot-sdk).
skill: ai-harness-regelwerk
schemaVersion: "1.0"
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.8
    description: Hat der Agent die Regelwerk-Aufgabe regelkonform geloest?
graders:
  - type: code
    name: has_output
    config:
      assertions:
        - "len(output) > 0"
tasks:
  - "tasks/*.yaml"
