name: ai-harness-regelwerk-eval-mock
description: Offline-Geruesttest mit Mock-Executor (prueft Aufbau, nicht das Modellverhalten).
skill: ai-harness-regelwerk
schemaVersion: "1.0"
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 60
  parallel: false
  executor: mock
  model: mock
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.0
    description: Geruest laeuft durch.
graders:
  - type: code
    name: has_output
    config:
      assertions:
        - "len(output) >= 0"
tasks:
  - "tasks/*.yaml"
